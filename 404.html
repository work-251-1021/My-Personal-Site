<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <meta name="robots" content="noindex, follow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050a1f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas for wave lines */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Jelly Cursor Elements matching your script.js */
        #cursor-jelly, #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            will-change: transform;
        }

        #cursor-jelly {
            width: 36px;
            height: 36px;
            border: 1.5px solid rgba(96, 165, 250, 0.7);
            background: rgba(59, 91, 255, 0.08);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        #cursor-dot {
            width: 7px;
            height: 7px;
            background: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.8);
        }

        @media (hover: none), (pointer: coarse) {
            #cursor-jelly, #cursor-dot {
                display: none !important;
            }
        }

        /* Real Liquid Glassmorphism Card */
        .liquid-glass {
            position: relative;
            z-index: 10;
            width: min(88%, 420px);
            padding: 45px 30px;
            text-align: center;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.25),
                inset 0 -1px 1px rgba(0, 0, 0, 0.2);
            animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Clean Flat 404 Typography */
        .code-404 {
            font-size: clamp(80px, 18vw, 120px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            color: #ffffff;
            user-select: none;
            margin-bottom: 25px;
        }

        /* Back to Home Button */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #3b5bff, #2563eb);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50px;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.55);
        }

        .btn-home:active {
            transform: translateY(0);
        }
    </style>
</head>
<body data-page="404">

    <!-- Waves Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Jelly Cursor Elements (Managed by script.js) -->
    <div id="cursor-jelly"></div>
    <div id="cursor-dot"></div>

    <!-- Liquid Glass Card -->
    <main class="liquid-glass">
        <div class="code-404">404</div>
        <a href="index.html" class="btn-home">Back to Home</a>
    </main>

    <!-- Project Script -->
    <script src="script.js"></script>
</body>
</html>
