<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Amir Rezaei</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- این بخش برای فعال شدن افکت موس الزامی است -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-follower" id="cursor-follower"></div>

    <!-- Navigation -->
    <nav>
        <div class="theme-toggle-container">
            <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
            <label for="theme-toggle" class="theme-toggle-label">
                <div class="toggle-thumb">
                    <div class="crater crater-1"></div>
                    <div class="crater crater-2"></div>
                    <div class="crater crater-3"></div>
                </div>
                <div class="clouds cloud-bg"></div>
                <div class="clouds cloud-fg"></div>
                <div class="star star-1">✦</div>
                <div class="star star-2">★</div>
                <div class="star star-3">✦</div>
                <div class="star star-4">★</div>
            </label>
        </div>

        <div class="logo-box">
            <a href="index.html" class="logo">Personal Page</a>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blog.html" class="active">Blog</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main style="max-width: 800px; margin: 120px auto 40px; padding: 0 20px;">
        
        <h1 style="font-size: 2rem; margin-bottom: 30px; font-weight: 700;">Posts</h1>

        <!-- لیست عمودی پست‌ها -->
        <div class="post-list" style="display: flex; flex-direction: column; gap: 15px;">
            
            <!-- کارت نمونه (مربعی) -->
            <!-- برای اضافه کردن پست جدید، همین بلوک a را کپی کنید -->
            <a href="posts/first-post.html" style="display: block; padding: 20px; border: 1px solid #334155; text-decoration: none; border-radius: 0px; color: inherit; transition: all 0.3s ease;">
                <h3 style="margin: 0 0 10px 0;">عنوان پست اول</h3>
                <p style="margin: 0; color: #94a3b8; font-size: 0.9rem;">توضیحات کوتاه درباره محتوای این پست...</p>
            </a>

        </div>

    </main>

</body>
</html>
