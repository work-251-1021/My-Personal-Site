<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amir Rezaei | Personal Page</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <style>

    .cursor-jelly,
    .cursor-dot {
      pointer-events: none !important; 
      z-index: 100000000 !important;  
    }


    .linux-terminal-modal {
      position: fixed;
      top: 120px;
      left: 80px;
      width: 580px;
      max-width: calc(100vw - 30px);
      height: 360px;
      background: rgba(48, 10, 36, 0.96); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 1px 1px rgba(255, 255, 255, 0.05);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Ubuntu Mono', 'Courier New', monospace;
      color: #ffffff;
      box-sizing: border-box;
      direction: ltr;
      text-align: left;
    }

    .linux-terminal-modal.hidden {
      display: none !important;
    }


    .linux-terminal-header {
      background: linear-gradient(180deg, #43423e 0%, #353430 100%);
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      position: relative;
      user-select: none;
      cursor: grab;
      border-bottom: 1px solid rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .linux-terminal-header:active {
      cursor: grabbing;
    }

    .linux-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .linux-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
    }

    .linux-btn.btn-close {
      background-color: #e95420;
      border: 1px solid #b3390d;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .linux-btn.btn-close:hover {
      background-color: #ff6f3d;
      transform: scale(1.1);
    }

    .linux-btn.btn-minimize {
      background-color: #666666;
      border: 1px solid #444444;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .linux-btn.btn-maximize {
      background-color: #666666;
      border: 1px solid #444444;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .linux-terminal-title {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: #dfdbd2;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      pointer-events: none;
      letter-spacing: 0.3px;
    }

    
    .linux-terminal-body {
      padding: 16px;
      font-size: 15px;
      line-height: 1.6;
      flex-grow: 1;
      overflow-y: auto;
      cursor: text;
    }

    .prompt-user {
      color: #8ae234;
      font-weight: 700;
    }

    .prompt-dir {
      color: #729fcf;
      font-weight: 700;
    }

    .prompt-symbol {
      color: #ffffff;
      font-weight: 700;
    }

    .term-line {
      margin-bottom: 5px;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .term-output {
      color: #eeeeec;
      margin-bottom: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .ls-dir {
      color: #729fcf;
      font-weight: bold;
      margin-right: 18px;
      display: inline-block;
    }

    .input-line {
      display: flex;
      align-items: center;
    }

    .term-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: 'Ubuntu Mono', 'Courier New', monospace;
      font-size: 15px;
      flex: 1;
      min-width: 100px;
      padding: 0;
      margin-left: 6px;
      caret-color: #ffffff;
    }
  </style>
</head>
<body data-page="home">

  <canvas id="bg-canvas"></canvas>
  <div class="cursor-jelly" id="cursor-jelly"></div>
  <div class="cursor-dot" id="cursor-dot"></div>

  <nav>
    <div class="theme-toggle-container">
      <input type="checkbox" id="theme-toggle" class="theme-toggle-input" aria-label="Toggle theme">
      <label for="theme-toggle" class="theme-toggle-label">
        <div class="toggle-thumb">
          <div class="crater crater-1"></div>
          <div class="crater crater-2"></div>
          <div class="crater crater-3"></div>
        </div>
        <div class="clouds cloud-bg"></div>
        <div class="clouds cloud-fg"></div>
        <div class="star star-1">✦</div>
        <div class="star star-2">★</div>
        <div class="star star-3">✦</div>
        <div class="star star-4">★</div>
        <div class="crater-aura crater-aura-1"></div>
        <div class="crater-aura crater-aura-2"></div>
      </label>
    </div>

    <div class="logo-box">
      <a href="index.html" class="logo">Personal Page</a>
    </div>

    <ul>
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <main class="hero">
    <div class="hero-text">
      <div class="hi">Hi, I am <span class="name">Amir Rezaei</span><span class="role">Python Developer</span></div>
      <p>I discover patterns, build smart tools, and solve real-world problems with Python.</p>
      <a href="projects.html" class="btn">Projects</a>
    </div>
    
    <div class="blob-wrap">
      <div class="blob-halo"></div>
      <div class="blob-bg"></div>
      <div class="blob-clip">
        <img class="blob-img" src="amir.jpg" alt="Amir Rezaei">
      </div>
    </div>
  </main>

  <!-- ================= Linux Floating Interactive Terminal ================= -->
  <div id="linux-terminal" class="linux-terminal-modal hidden">
    <div class="linux-terminal-header" id="linux-term-header">
      <div class="linux-controls">
        <span class="linux-btn btn-close" id="linux-term-close" title="Close"></span>
        <span class="linux-btn btn-minimize"></span>
        <span class="linux-btn btn-maximize"></span>
      </div>
      <div class="linux-terminal-title">amir-rezaei@work-251-1021: ~</div>
    </div>
    
    <div class="linux-terminal-body" id="linux-term-body">
      <div id="term-history"></div>
      <div class="input-line">
        <span class="prompt-user">amir-rezaei@work-251-1021</span>:<span class="prompt-dir">~</span><span class="prompt-symbol">$</span>
        <input type="text" id="term-cli-input" class="term-input" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
  </div>

 
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const terminal = document.getElementById("linux-terminal");
      const header = document.getElementById("linux-term-header");
      const closeBtn = document.getElementById("linux-term-close");
      const body = document.getElementById("linux-term-body");
      const cliInput = document.getElementById("term-cli-input");
      const history = document.getElementById("term-history");

      if (!terminal) return;

     
      const openTerminal = () => {
        terminal.classList.remove("hidden");
        setTimeout(() => cliInput.focus(), 50);
      };

      const closeTerminal = () => {
        terminal.classList.add("hidden");
      };

      if (closeBtn) closeBtn.addEventListener("click", closeTerminal);

      window.addEventListener("keydown", (e) => {
        const active = document.activeElement;
        if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA") && active !== cliInput) {
          return;
        }

        if (e.key === "0" || e.code === "Digit0" || e.code === "Numpad0") {
          e.preventDefault();
          if (terminal.classList.contains("hidden")) {
            openTerminal();
          } else {
            closeTerminal();
          }
        }
      });

    
      body.addEventListener("click", () => {
        cliInput.focus();
      });

     
      cliInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const rawCommand = cliInput.value;
          const cmd = rawCommand.trim();

          if (cmd === "clear") {
            history.innerHTML = "";
            cliInput.value = "";
            return;
          }

          if (cmd !== "") {

            const line = document.createElement("div");
            line.className = "term-line";
            line.innerHTML = `<span class="prompt-user">amir-rezaei@work-251-1021</span>:<span class="prompt-dir">~</span><span class="prompt-symbol">$</span> ${rawCommand}`;
            history.appendChild(line);

      
            const out = document.createElement("div");
            out.className = "term-output";

            switch (cmd.toLowerCase()) {
              case "help":
                out.innerHTML = "GNU bash, version 5.2-release (x86_64-pc-linux-gnu)<br>" +
                                "These shell commands are defined internally. Type `help' to see this list.<br><br>" +
                                "&nbsp;&nbsp;<b>ls</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;List information about the FILEs (the current directory by default)<br>" +
                                "&nbsp;&nbsp;<b>whoami</b>&nbsp;&nbsp;Print the user name associated with the current effective user ID<br>" +
                                "&nbsp;&nbsp;<b>clear</b>&nbsp;&nbsp;&nbsp;Clear the terminal screen<br>" +
                                "&nbsp;&nbsp;<b>help</b>&nbsp;&nbsp;&nbsp;&nbsp;Display information about builtin commands";
                break;
                
              case "ls":
                out.innerHTML = `<span class="ls-dir">Desktop</span><span class="ls-dir">Documents</span><span class="ls-dir">Downloads</span><span class="ls-dir">Music</span><span class="ls-dir">Pictures</span><span class="ls-dir">Videos</span><span class="ls-dir">projects</span>`;
                break;

              case "whoami":
                out.textContent = "amir-rezaei";
                break;

              default:
                out.textContent = `bash: ${cmd}: command not found`;
                break;
            }

            history.appendChild(out);
          } else {
            const line = document.createElement("div");
            line.className = "term-line";
            line.innerHTML = `<span class="prompt-user">amir-rezaei@work-251-1021</span>:<span class="prompt-dir">~</span><span class="prompt-symbol">$</span>`;
            history.appendChild(line);
          }

          cliInput.value = "";
          body.scrollTop = body.scrollHeight;
        }
      });

      
      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      header.addEventListener("mousedown", (e) => {
        if (e.target === closeBtn) return;
        isDragging = true;
        offsetX = e.clientX - terminal.offsetLeft;
        offsetY = e.clientY - terminal.offsetTop;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        
        let newX = e.clientX - offsetX;
        let newY = e.clientY - offsetY;

  
        newX = Math.max(10, Math.min(window.innerWidth - terminal.offsetWidth - 10, newX));
        newY = Math.max(10, Math.min(window.innerHeight - terminal.offsetHeight - 10, newY));

        terminal.style.left = `${newX}px`;
        terminal.style.top = `${newY}px`;
        terminal.style.bottom = "auto";
        terminal.style.right = "auto";
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });
    });
  </script>
</body>
</html>
